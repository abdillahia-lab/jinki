deliverables:
- tag: THERMAL BASELINE
  title: Facility thermal baseline
  body: Nightly thermal sweeps of every rooftop, mechanical system, and exterior surface build the reference state
    of your facility. Every future reading is measured against it, so anomalies surface before failures escalate.
- tag: DEGRADATION
  title: Degradation velocity tracking
  body: Continuous trend analysis across every data point measures how fast each asset is drifting from its baseline
    — flagging maintenance needs weeks before they become emergencies.
- tag: ALERT EVIDENCE
  title: Verified alert response
  body: On alarm activation the platform launches autonomously and reaches the alert zone in under 90 seconds, capturing
    thermal and visual evidence so your security operations center can verify before dispatching anyone.
- tag: SYSTEM FEED
  title: Direct integration delivery
  body: Intelligence flows into the platforms you already run — SCADA, VMS, BMS, CMMS, and digital twin environments.
    No new dashboards. No manual data transfers.
- tag: COMPLIANCE LOG
  title: Scheduled compliance records
  body: Thermal plume monitoring and visual compliance documentation captured on schedule, with automated regulatory
    reporting generation.
