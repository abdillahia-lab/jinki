faqs:
- q: Does anyone need to be on site to operate it?
  a: No. The dock station launches, recovers, and recharges the aerial platform autonomously. Missions run on schedule
    or trigger on alarms — zero operators required, 365 days a year.
- q: What happens when an alarm activates?
  a: The platform launches automatically and reaches the alert zone in under 90 seconds, streaming thermal and visual
    evidence to your security operations center so the alert can be verified before anyone is dispatched.
- q: Why do thermal patrols run at night?
  a: Thermal anomalies are most visible at night. Four night thermal patrols build and maintain the facility's thermal
    baseline, so degradation shows up as a measured trend rather than a surprise.
- q: Will my team need to learn a new dashboard?
  a: No. Intelligence is delivered into the systems you already run — SCADA, VMS, BMS, CMMS, and digital twin environments.
    No new dashboards, no manual data transfers.
- q: Can it operate in bad weather?
  a: Yes. The dock station is weatherproof, rated for -20 to 50 C, and the platform recharges in about 25 minutes
    between missions — operations continue around the clock through all seasons.
- q: How is this different from the one-time intelligence scan?
  a: 'The scan is a one-time assessment of your facility''s current condition. Autonomous deployment is the persistent
    version: a dock station on your site running 150-200 missions a month, tracking change over time instead of
    capturing a single snapshot.'
serviceType: Autonomous Aerial Monitoring
