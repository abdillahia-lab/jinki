deliverables:
- tag: SUMMARY
  title: Executive Summary
  body: Facility health score, total findings by severity, and recommended priority actions for leadership review.
- tag: FINDINGS
  title: Geolocated Findings
  body: Every anomaly mapped to a specific rooftop coordinate, with ΔT measurements, equipment ID, and severity
    rating.
- tag: STRUCTURE
  title: Structural Assessment
  body: Membrane condition ratings, area measurements, degradation velocity, and projected repair cost for every
    roof section.
- tag: COMPLIANCE
  title: Compliance Package
  body: NFPA 70B alignment, ASHRAE temperature verification, inspection certificates, and a full verification trail
    for every data point.
process:
- mono: T+0
  title: Scoping Call
  sub: We learn your facility, your priorities, and your pain points — a real conversation about what matters to
    your operations team.
- mono: WK 1
  title: Flight Planning
  sub: Airspace authorization, safety planning, and mission design tailored to your site geometry and inspection
    requirements.
- mono: DAY 1
  title: Data Capture
  sub: On-site aerial operations. Thermal and high-resolution visual data across every structure — typically completed
    in a single day.
- mono: HR 24
  title: AI Analysis
  sub: 'Our analytics pipeline processes thousands of data points: anomaly detection, severity classification, and
    automated damage assessment.'
- mono: HR 48
  title: Report Delivered
  sub: 'The Facility Intelligence Report: severity-ranked findings, remediation priorities, cost estimates, and
    suggested timelines.'
- mono: WK 2-3
  title: Review & Handoff
  sub: We walk your team through every finding. Questions answered, priorities confirmed, and a clear path forward.
midCta:
  title: Signed Monday, flying Friday.
  body: From signed engagement to delivered report, typically inside fifteen business days.
faqs:
- q: How fast do we get the report?
  a: Severity-ranked findings are delivered within 48 hours of the mission — two business days from capture to prioritized
    report.
- q: How long does the full engagement take?
  a: Two to three weeks end-to-end. From signed engagement to delivered report, typically inside fifteen business
    days, with on-site capture usually completed in a single day.
- q: What do we actually receive?
  a: One PDF engineered for your next maintenance window — not a file dump of raw imagery. It includes an executive
    summary, geolocated findings with ΔT measurements and severity ratings, a structural assessment, and a compliance
    package.
- q: Will the scan disrupt our operations?
  a: No. A single aerial mission covers 100% of the rooftop with no scaffolding, no personnel on the membrane, and
    no operational disruption.
- q: How are findings classified?
  a: Severity classification is aligned to NFPA 70B, so reports map directly to the electrical maintenance standard
    your team already uses, with ASHRAE temperature verification included.
- q: Can we see a sample report first?
  a: Yes. Request the sample report PDF — no sales call required.
serviceType: Aerial Infrastructure Inspection
