problems:
- tag: DC SFRA
  title: Controlled airspace grounds the exterior shot.
  body: Inside the DC Special Flight Rules Area and class-B controlled zones, outdoor flight is often off the table.
    The lobby, amenity deck, and cityscape-through-windows have to carry the listing instead.
- tag: RAW DUMPS
  title: Unretouched stills undercut the price tier.
  body: A raw dump of unedited frames sells a luxury property short. Every engagement here is shot-listed before
    the flight, reviewed by the owner or agent, and delivered edited.
- tag: MLS TIMING
  title: The listing window does not wait.
  body: A photography delay pushes the MLS date and stalls the launch. LAANC waivers alone add 5–14 days when the
    airspace requires one — unless someone files early.
- tag: WEATHER
  title: Twilight is a gamble without a plan.
  body: Blue-hour imagery depends on a sky no one can schedule. Without weather-windowed flights, the twilight shoot
    becomes a coin flip.
- tag: CONFIDENTIALITY
  title: Pre-market listings leak.
  body: Imagery of an unlisted property circulating early can compromise the launch. Pre-market work stays confidential
    under NDA by default.
