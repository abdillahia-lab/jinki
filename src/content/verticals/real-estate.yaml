faqs:
- q: Can you fly inside DC's restricted airspace?
  a: We are cleared for the Washington DC Special Flight Rules Area and file the FAA paperwork ourselves. LAANC
    authorization is typically same-day in most zones; where a Part 107 waiver is needed, it adds 5 to 14 days, and we quote
    the end-to-end timeline up front. Indoor-only shoots skip airspace planning entirely.
- q: How fast do you deliver?
  a: Edited hi-res stills and a 4K video master typically arrive within 48 hours of the shoot via secure link. The unedited
    archive is retained for 90 days in case you need a reshoot of a specific angle.
- q: How long is the shoot itself?
  a: 45 to 90 minutes for exterior and aerial work, and 2 to 3 hours for interior, lobby, and amenity shoots with
    proper lighting. We work from a pre-approved shot list at multiple altitudes and angles, signed off before we
    pack up.
- q: What if the property cannot be flown at all?
  a: We deliver gallery-grade interior, lobby, and amenity photography instead — architectural photography, not
    snapshots — so the listing still ships with imagery that matches the price tier.
- q: Do you keep pre-market listings confidential?
  a: Yes. NDA is the default for pre-market listings, and a mutual NDA is available before the first shoot. Every
    operation carries $5M in liability coverage, with proof available on request.
- q: What happens if weather ruins a twilight shoot?
  a: Twilight and blue-hour flights are scheduled in weather windows, and we reschedule at no charge if the sky
    does not cooperate.
