faqs:
- q: Can you legally fly over water and active port operations?
  a: Yes. Operations are planned under FAA Part 107 with overwater contingencies, coordinated
    with facility operations, and flown outside exclusion areas you define. Hampton Roads'
    military airspace coordination is part of mission planning, not an afterthought.
- q: Do operations interrupt cargo handling or vessel movements?
  a: No. All capture is standoff — no berth closures, no crane stoppages, no boarding. Missions
    are scheduled around your operations window, including night work when thermal contrast is best.
- q: What can thermal actually see on a vessel hull?
  a: Moisture in cored composite laminates, wet bulkhead cores, and machinery-space heat
    signatures read clearly in post-sunset thermal. It is a screening survey — findings are
    delivered with locations marked for a surveyor's confirmation.
- q: How fast can you document after a storm?
  a: Storm-response missions are prioritized — capture as soon as airspace and weather permit,
    with the geolocated evidence package delivered within 48 hours of the pass.
- q: How is sensitive port security data handled?
  a: A mutual NDA precedes every engagement. Imagery is encrypted AES-256 at rest and TLS 1.3
    in transit, with on-premises processing available for facilities that require it.
