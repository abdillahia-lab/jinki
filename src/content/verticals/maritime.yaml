problems:
- tag: CRANE DRIVES
  title: Terminal equipment fails under continuous load
  body: STS crane drives, spreader electrics, and reefer banks run hot long before they stop.
    Standoff thermal flags the heat rise while the berth schedule still has slack.
- tag: HULL MOISTURE
  title: Composite hulls hide water until the survey
  body: Moisture in cored laminates is invisible at the dock walk. Post-sunset thermal makes
    saturated sections read against dry laminate — before haul-out, not after.
- tag: LITHIUM RISK
  title: Marina fire risk has changed
  body: Battery banks aboard and ashore turn a single bad cell into a basin fire. Routine
    thermal sweeps catch charging anomalies across slips no camera covers.
- tag: OVERWATER GAPS
  title: The waterside perimeter is the soft side
  body: Fixed cameras end at the bulkhead. Aerial watch covers the approach water, the rafted
    hulls, and the dark side of every pier — where ground patrols can't walk.
- tag: STORM CLOCK
  title: Post-storm documentation decides the claim
  body: After a named storm, the operator who documents first settles first. One pass produces
    geolocated, time-stamped condition evidence across the whole facility.
