problems:
- tag: PATROL SPEED
  title: Guard patrols can't cover large campuses fast enough
  body: Aerial thermal surveillance covers your entire perimeter in minutes. Threats are detected and verified before
    ground teams reach the location.
- tag: BLIND SPOTS
  title: Fixed cameras have inherent blind spots
  body: Aerial vantage reduces coverage gaps caused by terrain, structures, and vegetation. Thermal imaging is designed
    to detect concealed activity that visible cameras miss.
- tag: FALSE ALARMS
  title: False alarm response wastes security resources
  body: Aerial verification classifies alerts before ground teams are dispatched. Real threats get immediate attention
    while unnecessary responses get filtered out.
- tag: SCALING COST
  title: Monitoring costs escalate with facility size
  body: One aerial system covers more ground than multiple fixed camera installations and guard posts. Scale coverage
    without scaling headcount.
