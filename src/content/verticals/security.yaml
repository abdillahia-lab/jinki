faqs:
- q: How fast can an aerial unit respond to a perimeter alert?
  a: The autonomous dock station goes from alert to airborne in under 90 seconds. A full sequence runs from detection
    to resolution in under two minutes, with every event classified, tracked, and documented automatically.
- q: Does this replace our guards and cameras?
  a: No. Aerial surveillance is a force multiplier, not a replacement. It completes your existing security stack
    with bidirectional integration into CCTV, access control, alarm systems, and SIEM, supporting a full alert-response-verify
    workflow.
- q: Can it detect intruders at night?
  a: Yes. Thermal imaging detects body heat, vehicle signatures, and equipment activity regardless of lighting or
    visual obstructions. Darkness and concealment become irrelevant when you see heat.
- q: How much ground can one system cover?
  a: A single mission covers 500+ acre perimeters, and terrain-aware patrols range across 1,000+ acres at large
    recreation properties. One aerial system covers more ground than multiple fixed camera installations and guard
    posts.
- q: How does aerial verification cut false alarm costs?
  a: When a sensor trips, an aerial unit verifies and classifies the alert before ground teams are dispatched. Real
    threats get immediate attention, and false alarms stop consuming your security resources.
- q: What do we receive after an incident?
  a: 'Rapid aerial documentation for investigation, insurance claims, and law enforcement: HD and thermal evidence
    with GPS-tagged imagery. Every engagement also delivers threat classifications, vulnerability findings, and
    remediation priorities — not raw video feeds.'
