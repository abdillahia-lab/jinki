    value: BWI CLASS B SHELF
  - key: COORDINATION
    value: LAANC + OVERWATER OPS
  - key: ADJACENT
    value: DC SFRA BOUNDARY SW
  - key: MOBILIZATION
    value: SCHEDULED — SAME WEEK
