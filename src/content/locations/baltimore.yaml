verticals:
- slug: maritime
  headline: The country's busiest vehicle port, watched from above.
  intro: The Port of Baltimore leads the nation in autos and roll-on/roll-off cargo — acres
    of staged vehicles, terminal equipment under continuous load, and a waterfront the 2024
    Key Bridge collapse proved can change in one night. Post-incident documentation speed
    decided real money that year. The operators who could document fastest settled first.
  points:
  - tag: RO-RO ACREAGE
    body: Staged-vehicle lots are dense, high-value, and fire-sensitive. Thermal sweeps
      read charging anomalies and hot brakes across the whole lot in one pass.
  - tag: TERMINAL PLANT
    body: Crane drives, conveyor electrics, and reefer banks surveyed at standoff against
      NFPA 70B severity classes — no berth interruption.
  - tag: INCIDENT CLOCK
    body: When the waterfront changes overnight, geolocated time-stamped condition evidence
      within 48 hours is the difference in the claim.
  faqs:
  - q: Can you fly over active terminal operations?
    a: Yes. All capture is standoff and coordinated with terminal operations — no berth
      closures, no crane stoppages. Overwater contingencies are part of mission planning
      under BWI Class B coordination.
  - q: How fast can you document after a storm or incident?
    a: Storm and incident response is prioritized — capture as soon as airspace and weather
      permit, evidence package within 48 hours of the pass.
- slug: data-centers
  headline: Coverage for the corridor the market is moving toward.
  intro: As Northern Virginia's power constraints push new builds outward, the Baltimore
    corridor's facilities — regional data centers, carrier hotels, and edge sites — inherit
    the same thermal failure modes with even less inspection coverage. The rooftop plant
    doesn't care how many megawatts the campus is.
  points:
  - tag: REGIONAL SITES
    body: Smaller facilities mean smaller maintenance teams. A single aerial pass replaces
      weeks of manual rooftop rounds.
  - tag: SAME PHYSICS
    body: HVAC cascade, membrane moisture, and switchgear heat rank against the same NFPA
      70B classes whether the hall is 2 MW or 200.
  - tag: BWI PROXIMITY
    body: Class B coordination is routine for us — proximity to the airport is a planning
      input, not a disqualifier.
  faqs:
  - q: Is a facility near BWI even flyable?
    a: Yes, in most locations — Class B requires LAANC authorization at the appropriate
      altitude, which we obtain as standard procedure. We confirm airspace feasibility for
      your specific address before any commitment.
  - q: We're a small site. Is this overkill?
    a: The economics favor small sites — one mission baselines the entire envelope and
      plant for less than the cost of a single emergency vendor call-out.
- slug: energy-grid
  headline: The grid behind the harbor.
  intro: Baltimore's industrial load — terminals, rail, manufacturing — rides on substations
    and feeder corridors that run through some of the oldest utility territory on the East
    Coast. Aging connection hardware shows heat before it shows failure, and aerial thermal
    reads it without an outage or a bucket truck.
  points:
  - tag: AGING PLANT
    body: Legacy splices, clamps, and bushings carry modern load. The thermal signature of
      a failing connection is visible from standoff long before it lets go.
  - tag: INDUSTRIAL FEEDERS
    body: The feeders serving terminals and heavy industry are exactly the ones whose
      outages cost the most per hour.
  - tag: CORRIDOR ACCESS
    body: Rail corridors, waterfront easements, and fenced rights-of-way are slow to walk
      and fast to fly.
  faqs:
  - q: Do you work for utilities or facility owners?
    a: Both. Utility corridor work is coordinated with the asset owner; customer-owned
      substations and interconnects on industrial sites are surveyed directly for the
      facility operator.
  - q: Can you inspect energized equipment?
    a: Yes — that is the point. Thermal inspection at standoff requires no outage, no
      contact, and no scaffolding. Findings are ranked for de-energized follow-up.
- slug: security
  headline: A perimeter watch for the working waterfront.
  intro: Terminal yards, staged cargo, and industrial sites along the Patapsco present
    kilometers of fence line, rail gaps, and water approaches that fixed cameras cover in
    fragments. Aerial thermal covers it as one continuous picture — including the water
    side, where the cameras end.
  points:
  - tag: WATER SIDE
    body: The approach by water is the least-instrumented route into any waterfront
      facility. Overwater-capable aerial watch closes it.
  - tag: CARGO VALUE
    body: Staged vehicles and containered goods concentrate value in open lots. Thermal
      picks out a human signature among ten thousand cold vehicles.
  - tag: RAIL GAPS
    body: Rail entries breach fence lines by design. Scheduled sweeps watch the gaps the
      perimeter can't physically close.
  faqs:
  - q: Can you integrate with our existing security operation?
    a: Yes. Alarm-triggered aerial verification feeds your existing dispatch — the aerial
      layer verifies before a guard is committed, with the recorded pass as documentation.
  - q: Is overnight coverage possible?
    a: Yes. Thermal capture is strongest at night, and persistent deployments run around
      the clock.
