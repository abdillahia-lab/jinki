metaTitle: Baltimore Aerial Thermal Inspection — Jinki Aerial Intelligence
metaDescription: Aerial thermal inspection across Baltimore and the BWI corridor — port terminals,
  industrial waterfront, substations, and data facilities, flown with Class B coordination.
hero:
  kicker: BALTIMORE // PORT · BWI CORRIDOR
  headline: An industrial waterfront deserves <em>an industrial watch.</em>
  sub: Terminals, rail yards, refineries-adjacent storage, and a port that moves more
    vehicles than any in the country. Baltimore's working waterfront fails in industrial
    ways — and aerial thermal finds those failures while they are still maintenance items.
  datum: WORKING PORT
airspace:
  label: BWI CLASS B · PORT COORDINATION
  body: The Baltimore basin sits under BWI Marshall's Class B shelf, with Martin State
    traffic to the east and the DC SFRA boundary to the southwest. Operating here means
    LAANC coordination, altitude discipline, and overwater contingency planning across the
    Patapsco — procedures Jinki runs as standard practice on every mission.
