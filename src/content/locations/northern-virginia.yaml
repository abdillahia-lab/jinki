  kicker: NORTHERN VIRGINIA // ASHBURN · DULLES CORRIDOR
  headline: We fly the airspace <em>most operators can't enter.</em>
  sub: The Dulles corridor sits inside the DC Special Flight Rules Area — among the most
    restricted airspace in the country. Jinki holds the authorization and the training to
    operate here, and this is our home corridor. Same-day mobilization, no travel charges.
  datum: HOME CORRIDOR
airspace:
  label: DC SFRA · IAD CLASS B
  body: Every flight within 30 nautical miles of Washington falls inside the DC Special
    Flight Rules Area, with the inner Flight Restricted Zone tighter still. Operating here
    requires FAA SFRA authorization and special awareness training that most aerial operators
    never obtain — they decline the work or fly somewhere easier. Jinki is certificated for
    SFRA operations and coordinates Dulles Class B through LAANC as routine procedure, not
    exception handling.
