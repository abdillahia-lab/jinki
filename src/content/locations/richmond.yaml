verticals:
- slug: data-centers
  headline: Commission it right, then keep it baselined.
  intro: The hyperscale build-out east of Richmond is putting more critical megawatts into
    central Virginia every quarter. New campuses mean commissioning-phase envelopes,
    first-year settlement, and rooftop plants that have never had a thermal baseline —
    the cheapest moment to start one is before the first anomaly, not after.
  points:
  - tag: COMMISSIONING
    body: Envelope and plant thermal at handover documents day-one condition — the
      baseline every future warranty conversation refers back to.
  - tag: FIRST BASELINE
    body: A campus that has never been flown has findings by definition. The first pass
      is always the highest-yield one.
  - tag: OPEN AIRSPACE
    body: Most of the corridor sits outside controlled airspace — scheduling is limited
      by weather windows, not authorization queues.
  faqs:
  - q: Can you fly a campus still under construction?
    a: Yes, coordinated with the general contractor's safety plan. Construction-phase
      thermal catches envelope defects while the trades responsible are still on site.
  - q: How often should an operating campus be flown?
    a: Quarterly is the typical cadence for baseline drift; monthly for facilities
      tracking specific degradation. One annual pass is the minimum that still produces
      a usable trend line.
- slug: energy-grid
  headline: The transmission story under the growth story.
  intro: Every new campus east of Richmond lands on transmission and substation
    infrastructure that was planned decades before hyperscale load existed. Corridor
    hardware running closer to rating shows thermal signatures earlier — and central
    Virginia's open airspace makes corridor sweeps here the most efficient in our
    operating area.
  points:
  - tag: NEW LOAD
    body: Interconnects and substation hardware serving new campuses run hot first at
      splices and switching points — visible at standoff before protective relays know.
  - tag: EFFICIENT SWEEPS
    body: Uncontrolled airspace over rural corridors means long uninterrupted mission
      legs — more structures per day than anywhere else we operate.
  - tag: VEGETATION
    body: Corridor encroachment in fast-growing seasons is mapped in the same pass as
      the hardware survey.
  faqs:
  - q: How much corridor can you cover in a day?
    a: Up to 50 miles per mission day in open airspace, captured structure-by-structure
      with geolocated findings per tower.
  - q: Do you survey customer-owned substations?
    a: Yes — campus interconnects and private substations are surveyed for the facility
      operator directly, ranked against NFPA 70B severity classes.
- slug: agriculture
  headline: Acreage intelligence for central Virginia's working land.
  intro: Hanover, Goochland, and the counties around Richmond run row crops, specialty
    operations, and vineyards on land where irrigation problems and crop stress hide in
    plain sight. Multispectral and thermal capture reads the whole operation in one
    flight — zone by zone, while there is still time in the season to act.
  points:
  - tag: IRRIGATION
    body: A failing line or clogged emitter shows as a thermal stripe days before it
      shows as a yield loss.
  - tag: STRESS MAPPING
    body: Crop stress maps at zone level turn "the back forty looks tired" into a
      prescription your agronomist can act on.
  - tag: SEASON CLOCK
    body: Weekly passes during critical growth windows; open airspace makes the cadence
      affordable.
  faqs:
  - q: What size operation does this make sense for?
    a: The economics work from roughly a hundred acres up — one flight covers more
      ground than a week of scouting, and the per-acre cost drops with scale.
  - q: Do you interpret the data or just deliver maps?
    a: Findings are delivered ranked and annotated — what changed, where, and how urgent.
      Your agronomist gets analysis, not raw imagery to decode.
- slug: security
  headline: Watch for the logistics corridor.
  intro: The distribution parks and fulfillment campuses along I-95 concentrate inventory
    behind long fence lines in open country. Ground patrol covers them slowly; fixed
    cameras cover them partially. Aerial thermal covers the whole footprint — yard, dock
    doors, trailer rows, and the dark field behind the back fence.
  points:
  - tag: TRAILER YARDS
    body: Staged trailers are the soft target — thermal separates a warm cab or a human
      signature from a thousand cold boxes instantly.
  - tag: OPEN GROUND
    body: Rural-edge sites back onto fields and treelines no camera pole reaches. The
      aerial layer is the only economical way to watch them.
  - tag: MULTI-SITE
    body: Operators with several parks in the metro get one watch program across all of
      them, on one report format.
  faqs:
  - q: Can one deployment cover multiple nearby sites?
    a: Within range limits, yes — and scheduled sweep programs rotate across sites on a
      cadence matched to your risk profile.
  - q: What happens when something is found at 3 AM?
    a: Alarm-triggered verification feeds your dispatch with location and a live thermal
      read — your responder rolls to a verified event, not a guess.
