hero:
  kicker: RICHMOND // CENTRAL VIRGINIA
  headline: The next data center corridor <em>is already under load.</em>
  sub: Hyperscale campuses east of the city, transmission corridors feeding them, logistics
    parks along I-95, and working farmland in every direction. Central Virginia's
    infrastructure build-out is fast — and inspection coverage hasn't kept pace.
  datum: GROWTH CORRIDOR
airspace:
  label: RIC CLASS C · OPEN COUNTY
  body: Richmond International's Class C is compact, and most of central Virginia's
    infrastructure sits in uncontrolled airspace beyond it — straightforward LAANC
    coordination near the field, unrestricted operations across the surrounding counties.
    Of all our metros, Richmond is the most permissive airspace; missions here are limited
    by weather, not authorization.
