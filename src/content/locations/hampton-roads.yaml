title: Hampton Roads
short: HRVA
order: 4
metaTitle: Hampton Roads Aerial Thermal Inspection — Jinki Aerial Intelligence
metaDescription: Aerial thermal inspection across Norfolk, Virginia Beach, and the Port of
  Virginia — terminals, marinas, coastal facilities, and substations, flown with full
  military airspace coordination.
hero:
  kicker: HAMPTON ROADS // NORFOLK · VIRGINIA BEACH · NEWPORT NEWS
  headline: The most layered airspace on the coast. <em>We plan for all of it.</em>
  sub: The world's largest naval complex, three commercial airfields, and the deepest
    shipping channel on the East Coast share one harbor. Flying here is a coordination
    problem most operators won't take on — and the reason the region's private facilities
    go under-covered.
  datum: MIL-COORD
airspace:
  label: ORF CLASS C · MILITARY COORDINATION
  body: Hampton Roads stacks Norfolk International's Class C against naval air traffic,
    Oceana's fighter pattern, Langley's restricted areas, and continuous harbor operations.
    Every Jinki mission here is planned against the full airspace picture — military
    coordination included — with overwater contingencies as standard. We serve private and
    commercial facilities; the military airspace is a planning reality we handle, not a
    market we sell to.
  facts:
  - key: AIRSPACE
    value: ORF CLASS C + MIL AREAS
  - key: COORDINATION
    value: FULL PICTURE, PER MISSION
  - key: OVERWATER
    value: RATED + PLANNED
  - key: MOBILIZATION
    value: SCHEDULED — PRIORITY STORM
coverage:
  body: Hampton Roads missions are scheduled engagements staged for full mission days —
    the drive from our corridor argues for covering terminal, marina, and substation in
    one visit. Named-storm response is prioritized over all routine work.
  areas:
  - Norfolk
